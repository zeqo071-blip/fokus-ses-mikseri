<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fokus Səs Mikseri</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#EAF2F0;--mute:#A9BDBB;--glass:rgba(14,28,32,.45);--edge:rgba(255,255,255,.16);--track:rgba(255,255,255,.18);--btn:rgba(255,255,255,.1);--amb:#F2B866;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--ink:#10262A;--mute:#40585B;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--track:rgba(16,38,42,.16);--btn:rgba(255,255,255,.55);--amb:#B8721F}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ink:#10262A;--mute:#40585B;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--track:rgba(16,38,42,.16);--btn:rgba(255,255,255,.55);--amb:#B8721F}}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh;background:#0d1a1f}
#stage{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 20px 90px;transition:opacity .6s,transform .6s,visibility .6s}
body.zen main{opacity:0;visibility:hidden;transform:scale(.97)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:italic 600 clamp(24px,4vw,30px)/1.1 Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
button{font:600 15px Figtree,system-ui,sans-serif;color:var(--ink);background:var(--btn);border:1px solid var(--edge);border-radius:999px;padding:9px 18px;cursor:pointer;min-height:44px;backdrop-filter:blur(10px);transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.96)}
button.primary{background:var(--ink);color:#0d1a1f;border-color:transparent}
:root[data-theme="light"] button.primary{color:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) button.primary{color:#fff}}
button.on{background:var(--ink);color:#0d1a1f}
:root[data-theme="light"] button.on{color:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) button.on{color:#fff}}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.hero{display:grid;place-items:center;text-align:center;padding:28px 0 20px}
.caption{font:italic 300 clamp(40px,10vw,88px)/1 Fraunces,Georgia,serif;letter-spacing:-.025em;margin:0 0 8px;--cc:var(--ink);color:var(--cc);text-shadow:0 0 .7em color-mix(in srgb,var(--cc) 40%,transparent);transition:opacity .5s,filter .5s,transform .5s,color .8s}
.caption.out{opacity:0;filter:blur(10px);transform:translateY(8px)}
.hint{color:var(--mute);margin:0 0 22px}
.ring{position:relative;width:min(64vw,230px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--amb);stroke-linecap:round;transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 6px var(--amb))}
.ring .t{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font:600 clamp(40px,11vw,58px)/1 Fraunces,Georgia,serif;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
.ring span{color:var(--mute);font-size:14px;margin-top:6px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;padding:20px;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ch{border-radius:18px;padding:14px;background:rgba(255,255,255,.06);border:1px solid var(--edge);transition:box-shadow .4s,background .4s}
.ch.live{box-shadow:0 0 28px -4px var(--c);background:rgba(255,255,255,.1)}
.ch label{display:flex;align-items:center;gap:8px;font-weight:600}
.ch .ic{font-size:24px;transition:transform .4s}
.ch.live .ic{transform:scale(1.25) rotate(-6deg)}
.ch output{float:right;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:pointer;--v:0%;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--c) var(--v),var(--track) var(--v))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--c) var(--v),var(--track) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--c);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--c)}
h2{font:600 21px/1.2 Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0 0 14px}
#link{display:none;width:100%;margin-top:12px;padding:10px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--btn);color:var(--ink);font:14px Figtree,sans-serif}
#toast{min-height:24px;margin-top:10px;color:var(--amb);font-weight:600;text-align:center}
.caption span{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;filter:blur(12px);transform:translateY(.45em) rotate(4deg)}to{opacity:1;filter:none;transform:none}}
.ch{transition:box-shadow .4s,background .4s,transform .3s}.ch:hover{transform:translateY(-3px)}
.master{margin-top:18px;padding-top:16px;border-top:1px solid var(--edge);display:grid;gap:4px}
.master label{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:6px}
.master output{margin-left:auto;color:var(--mute);font-weight:400}
.sleep{justify-content:flex-start;align-items:center;margin-top:10px}
.sleep span{font-weight:600;margin-right:4px}
.sleep button{padding:6px 14px;min-height:38px;font-size:14px}
#zen{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
.in{opacity:0;transform:translateY(24px);animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
.in:nth-child(2){animation-delay:.15s}.in:nth-child(3){animation-delay:.3s}.in:nth-child(4){animation-delay:.45s}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<main>
<header class="in">
  <h1>Fokus Səs Mikseri</h1>
  <button id="theme" aria-label="Qaranlıq və işıqlı rejimi dəyiş">🌓 Rejim</button>
</header>

<div class="hero in">
  <h2 class="caption" id="cap" style="margin-bottom:6px">Sakitlik</h2>
  <p class="hint">Səsi artır, mənzərə səninlə dəyişsin.</p>
  <div class="ring">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="92"/><circle class="fg" id="arc" cx="100" cy="100" r="92" stroke-dasharray="578.05" stroke-dashoffset="0"/></svg>
    <div class="t"><b id="time">25:00</b><span id="mode">Fokus vaxtı</span></div>
  </div>
  <div class="row" style="margin-top:20px">
    <button id="tstart" class="primary">Başla</button>
    <button id="treset">Sıfırla</button>
    <button id="m-focus" class="on" aria-pressed="true">Fokus 25</button>
    <button id="m-break" aria-pressed="false">Fasilə 5</button>
  </div>
</div>

<section class="glass in" aria-labelledby="h-mix">
  <h2 id="h-mix">Səs kanalları</h2>
  <div class="chs" id="channels"></div>
  <div class="master">
    <label for="master">🔊 Ümumi səs<output id="mo">80</output></label>
    <input type="range" id="master" min="0" max="100" value="80" style="--c:var(--amb);--v:80%">
    <label for="tone">🎚️ Ton<output id="to">parlaq</output></label>
    <input type="range" id="tone" min="0" max="100" value="100" style="--c:var(--amb);--v:100%">
    <div class="row sleep"><span>😴 Yuxu taymeri</span><button data-s="0" class="on">Yox</button><button data-s="15">15 dəq</button><button data-s="30">30 dəq</button><button data-s="60">60 dəq</button></div>
    <div id="sl" class="hint" style="margin:6px 0 0"></div>
  </div>
  <div class="row" style="margin-top:16px">
    <button id="play" class="primary">▶ Dinlə</button>
    <button id="mute">Hamısını söndür</button>
  </div>
</section>

<section class="glass in" aria-labelledby="h-pre">
  <h2 id="h-pre">Hazır mikslər</h2>
  <div class="row" id="presets"></div>
  <div class="row" style="margin-top:14px">
    <button id="save">Miksi saxla</button>
    <button id="share">Linki kopyala</button>
  </div>
  <input id="link" readonly aria-label="Miks linki">
  <div id="toast" role="status" aria-live="polite"></div>
</section>
</main>
<button id="zen" aria-pressed="false">🌌 Sakit rejim</button>

<script>
(function(){
var CH=[
 {id:'rain',name:'Yağış',icon:'🌧️',base:.5,c:'#7FB4E8',cap:'Yağışlı axşam'},
 {id:'wind',name:'Külək',icon:'🍃',base:.6,c:'#A9D6A0',cap:'Küləkli təpə'},
 {id:'wave',name:'Dalğa',icon:'🌊',base:.8,c:'#3CC3CF',cap:'Dəniz sahili'},
 {id:'cafe',name:'Kafe',icon:'☕',base:.7,c:'#F0A458',cap:'Küncdəki kafe'},
 {id:'white',name:'Ağ küy',icon:'📻',base:.25,c:'#C9CFE8',cap:'Sakit otaq'},
 {id:'fire',name:'Tonqal',icon:'🔥',base:.6,c:'#FF8A3D',cap:'Tonqal başında'},
 {id:'bird',name:'Quşlar',icon:'🐦',base:.35,c:'#F2D96B',cap:'Meşə səhəri'},
 {id:'cricket',name:'Cırcırama',icon:'🦗',base:.12,c:'#8FE3A1',cap:'Yay gecəsi'},
 {id:'thunder',name:'Tufan',icon:'⛈️',base:.9,c:'#B79CFF',cap:'Tufan qopur'}
];
var PRESETS=[
 {name:'Dərin fokus',v:{rain:25,wind:10,wave:0,cafe:0,white:30}},
 {name:'Rahat oxu',v:{rain:20,wind:0,wave:10,cafe:35,white:0}},
 {name:'Yağışlı gün',v:{rain:70,wind:25,wave:0,cafe:10,white:0}},
 {name:'Meşə səhəri',v:{wind:20,bird:55}},
 {name:'Gecə kampı',v:{fire:60,cricket:50,wind:10}},
 {name:'Tufan',v:{rain:65,wind:40,thunder:55}},
 {name:'Sahil axşamı',v:{wave:55,wind:15,bird:15}}
];
var state={},vis={},gains={},ctx=null,built=false,playing=false,cafeLevel=0,flash=0,bolt=[],mVal=80,tVal=100,masterG=null,toneF=null;
CH.forEach(function(c){state[c.id]=0;vis[c.id]=0});
var $=function(id){return document.getElementById(id)};
var root=document.documentElement;

/* ---------- Interfeys ---------- */
var box=$('channels'),sliders={},outs={},cards={};
CH.forEach(function(c){
  var r=document.createElement('div');r.className='ch';r.style.setProperty('--c',c.c);
  r.innerHTML='<label for="s-'+c.id+'"><span class="ic">'+c.icon+'</span>'+c.name+'<output style="margin-left:auto">0</output></label><input type="range" id="s-'+c.id+'" min="0" max="100" value="0">';
  box.appendChild(r);cards[c.id]=r;
  sliders[c.id]=r.querySelector('input');outs[c.id]=r.querySelector('output');
  sliders[c.id].addEventListener('input',function(){setVol(c.id,+this.value);startPlay()});
});
function paint(id){var v=state[id];sliders[id].value=v;sliders[id].style.setProperty('--v',v+'%');outs[id].textContent=v;cards[id].classList.toggle('live',v>0)}
function gainOf(id){var c=CH.filter(function(x){return x.id===id})[0];return c.base*Math.pow(state[id]/100,2)}
function setVol(id,v){
  state[id]=v;paint(id);if(id==='cafe')cafeLevel=v;
  if(gains[id])gains[id].gain.setTargetAtTime(gainOf(id),ctx.currentTime,.06);
  caption();
}
function applyMix(m){CH.forEach(function(c){setVol(c.id,Math.max(0,Math.min(100,+m[c.id]||0)))})}
PRESETS.forEach(function(p){
  var b=document.createElement('button');b.textContent=p.name;
  b.onclick=function(){applyMix(p.v);startPlay();toast(p.name+' miksi tətbiq olundu')};
  $('presets').appendChild(b);
});
var capEl=$('cap'),capNow='Sakitlik';
function caption(){
  var best=null,bv=0;CH.forEach(function(c){if(state[c.id]>bv){bv=state[c.id];best=c}});
  var t=best?best.cap:'Sakitlik';
  if(t===capNow)return;capNow=t;capEl.classList.add('out');var col=best?best.c:'var(--ink)';
  setTimeout(function(){capEl.textContent='';capEl.style.setProperty('--cc',col);capEl.setAttribute('aria-label',t);
    t.split('').forEach(function(ch,j){var s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=(j*45)+'ms';s.setAttribute('aria-hidden','true');capEl.appendChild(s)});
    capEl.classList.remove('out')},380);
}

/* ---------- Səs ---------- */
function noiseSrc(type){
  var sr=ctx.sampleRate,len=sr*4,buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0),i,w;
  if(type==='white'){for(i=0;i<len;i++)d[i]=Math.random()*2-1}
  else if(type==='brown'){var l=0;for(i=0;i<len;i++){w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}}
  else{var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(i=0;i<len;i++){w=Math.random()*2-1;
      b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;
      b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}}
  var s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;
}
function filt(type,f,q){var n=ctx.createBiquadFilter();n.type=type;n.frequency.value=f;if(q)n.Q.value=q;return n}
function lfo(freq,amt,target){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.value=amt;o.connect(g);g.connect(target);o.start()}
function chain(){for(var i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1]);return arguments[arguments.length-1]}
function build(){
  if(built)return;built=true;
  var comp=ctx.createDynamicsCompressor(),master=ctx.createGain();master.gain.value=mVal/100;
  toneF=filt('lowpass',toneHz(),.7);comp.connect(toneF);toneF.connect(master);master.connect(ctx.destination);masterG=master;
  CH.forEach(function(c){var g=ctx.createGain();g.gain.value=0;g.connect(comp);gains[c.id]=g});
  var mod;
  chain(noiseSrc('pink'),filt('highpass',500),filt('lowpass',9000),gains.rain);
  mod=ctx.createGain();mod.gain.value=.7;var wf=filt('bandpass',500,.8);
  chain(noiseSrc('brown'),wf,mod,gains.wind);lfo(.13,300,wf.frequency);lfo(.07,.3,mod.gain);
  mod=ctx.createGain();mod.gain.value=.55;
  chain(noiseSrc('brown'),filt('lowpass',500),mod,gains.wave);lfo(.1,.45,mod.gain);
  mod=ctx.createGain();mod.gain.value=.6;
  chain(noiseSrc('pink'),filt('bandpass',900,.6),mod,gains.cafe);lfo(.4,.2,mod.gain);lfo(.9,.15,mod.gain);
  (function clink(){
    if(ctx&&ctx.state==='running'&&cafeLevel>5){
      var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=2200+Math.random()*2200;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
      o.connect(g);g.connect(gains.cafe);o.start(t);o.stop(t+.25);
    }
    setTimeout(clink,1800+Math.random()*4500);
  })();
  chain(noiseSrc('white'),gains.white);
  /* tonqal: alov uğultusu və çıtırtı */
  chain(noiseSrc('brown'),filt('lowpass',320),gains.fire);
  var popBuf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.1),ctx.sampleRate),pd=popBuf.getChannelData(0);
  for(var q=0;q<pd.length;q++)pd[q]=(Math.random()*2-1)*Math.pow(1-q/pd.length,3);
  (function pop(){
    if(ctx.state==='running'&&state.fire>3){var ps=ctx.createBufferSource(),pg=ctx.createGain();
      ps.buffer=popBuf;ps.playbackRate.value=.6+Math.random()*1.2;pg.gain.value=.3+Math.random()*.7;
      chain(ps,filt('highpass',900+Math.random()*2500),pg,gains.fire);ps.start()}
    setTimeout(pop,40+Math.random()*(state.fire>60?200:420));
  })();
  /* quşlar */
  (function chirp(){
    if(ctx.state==='running'&&state.bird>3){
      var n=2+Math.floor(Math.random()*4),f0=2400+Math.random()*2600,t0=ctx.currentTime;
      for(var k=0;k<n;k++){var o=ctx.createOscillator(),eg=ctx.createGain(),t=t0+k*.11;
        o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*(1.2+Math.random()*.5),t+.08);
        eg.gain.setValueAtTime(.0001,t);eg.gain.exponentialRampToValueAtTime(.5,t+.015);eg.gain.exponentialRampToValueAtTime(.0001,t+.09);
        o.connect(eg);eg.connect(gains.bird);o.start(t);o.stop(t+.12)}
    }
    setTimeout(chirp,state.bird>60?900+Math.random()*1800:2000+Math.random()*4000);
  })();
  /* cırcırama */
  [4300,4650].forEach(function(f,j){var o=ctx.createOscillator(),a=ctx.createGain(),bp=filt('bandpass',f,6);
    o.frequency.value=f;a.gain.value=.5;o.connect(a);a.connect(bp);bp.connect(gains.cricket);o.start();lfo(j?5.3:6.7,.5,a.gain)});
  /* tufan */
  var tn=ctx.createGain();tn.gain.value=0;var tf=filt('lowpass',180);chain(noiseSrc('brown'),tf,tn,gains.thunder);
  function boom(){
    makeBolt();flash=1;setTimeout(function(){flash=.8},140);
    var t=ctx.currentTime+.5+Math.random()*.7;
    tn.gain.cancelScheduledValues(t);tn.gain.setValueAtTime(0,t);tn.gain.linearRampToValueAtTime(1.6,t+.25);tn.gain.setTargetAtTime(0,t+.4,1.6+Math.random()*1.6);
    tf.frequency.setValueAtTime(260,t);tf.frequency.exponentialRampToValueAtTime(90,t+3);
  }
  var nb=0;setInterval(function(){if(ctx.state==='running'&&state.thunder>3&&Date.now()>=nb){nb=Date.now()+(state.thunder>60?7000+Math.random()*7000:13000+Math.random()*14000);boom()}},500);
  CH.forEach(function(c){gains[c.id].gain.value=gainOf(c.id)});
}
function startPlay(){
  if(!ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast('Brauzer səs yaratmağı dəstəkləmir');return}ctx=new AC()}
  build();if(ctx.state!=='running')ctx.resume();
  if(masterG&&!fading)masterG.gain.setTargetAtTime(mVal/100,ctx.currentTime,.4);
  playing=true;$('play').textContent='⏸ Dayandır';
}
$('play').onclick=function(){if(playing){ctx.suspend();playing=false;this.textContent='▶ Dinlə'}else startPlay()};
$('mute').onclick=function(){CH.forEach(function(c){setVol(c.id,0)});toast('Bütün səslər söndürüldü')};
function toneHz(){return 600*Math.pow(26,tVal/100)}
function makeBolt(){var x=rnd(.2,.8),y=0;bolt=[[x,0]];while(y<.62){y+=rnd(.03,.08);x+=rnd(-.05,.05);bolt.push([x,y])}}
function bind(el,fn){el.addEventListener('input',function(){this.style.setProperty('--v',this.value+'%');fn(+this.value);startPlay()})}
bind($('master'),function(v){mVal=v;$('mo').textContent=v;if(masterG)masterG.gain.setTargetAtTime(v/100,ctx.currentTime,.05)});
bind($('tone'),function(v){tVal=v;$('to').textContent=v<34?'yumşaq':v>66?'parlaq':'orta';if(toneF)toneF.frequency.setTargetAtTime(toneHz(),ctx.currentTime,.08)});
var sleepEnd=0,sleepTimer=null,fading=false;
document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('[data-s]').forEach(function(x){x.classList.toggle('on',x===b)});
  clearInterval(sleepTimer);fading=false;if(masterG)masterG.gain.setTargetAtTime(mVal/100,ctx.currentTime,.3);
  var m=+b.dataset.s;if(!m){$('sl').textContent='';return}
  sleepEnd=Date.now()+m*60000;
  sleepTimer=setInterval(function(){
    var r=Math.round((sleepEnd-Date.now())/1000);
    if(r<=0){clearInterval(sleepTimer);fading=false;if(ctx){ctx.suspend();playing=false;$('play').textContent='▶ Dinlə'}$('sl').textContent='Yuxu taymeri bitdi. Şirin yuxular.';return}
    if(r<=20&&!fading&&masterG){fading=true;masterG.gain.setTargetAtTime(0,ctx.currentTime,6)}
    $('sl').textContent='Səs '+fmt(r)+' sonra sönəcək';
  },1000)}});

/* ---------- Saxla, paylaş, tema ---------- */
function toast(t){$('toast').textContent=t}
function enc(){return 'm='+CH.map(function(c){return state[c.id]}).join(',')}
$('save').onclick=function(){
  try{localStorage.setItem('fsm-mix',JSON.stringify(state));toast('Miks saxlanıldı. Növbəti dəfə avtomatik açılacaq.')}
  catch(e){toast('Bu brauzerdə saxlamaq olmadı. Linki kopyalayıb istifadə et.')}
};
$('share').onclick=function(){
  var url=location.href.split('#')[0]+'#'+enc(),inp=$('link');
  inp.value=url;inp.style.display='block';inp.select();
  try{navigator.clipboard.writeText(url).then(function(){toast('Link kopyalandı')},function(){toast('Linki seçib kopyala')})}
  catch(e){toast('Linki seçib kopyala')}
};
(function load(){
  var m=null,h=location.hash.match(/m=([\d,]+)/);
  if(h){var a=h[1].split(',');m={};CH.forEach(function(c,i){m[c.id]=a[i]});toast('Paylaşılan miks yükləndi. Dinləmək üçün “Dinlə” düyməsinə bas.')}
  else{try{var s=localStorage.getItem('fsm-mix');if(s)m=JSON.parse(s)}catch(e){}}
  if(m)applyMix(m);else CH.forEach(function(c){paint(c.id)});
  CH.forEach(function(c){vis[c.id]=state[c.id]/100});
})();
try{var th=localStorage.getItem('fsm-theme');if(th)root.setAttribute('data-theme',th)}catch(e){}
function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':!matchMedia('(prefers-color-scheme:light)').matches}
$('theme').onclick=function(){var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('fsm-theme',n)}catch(e){}};
$('zen').onclick=function(){var z=document.body.classList.toggle('zen');this.setAttribute('aria-pressed',z);this.textContent=z?'✕ Geri qayıt':'🌌 Sakit rejim'};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('zen'))$('zen').click()});

/* ---------- Taymer ---------- */
var DUR={focus:25*60,brk:5*60},mode='focus',left=DUR.focus,running=false,endAt=0,tick=null,C=578.05,chimeCtx=null;
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function drawT(){
  $('time').textContent=fmt(left);$('arc').style.strokeDashoffset=C*(1-left/DUR[mode]);
  $('mode').textContent=mode==='focus'?'Fokus vaxtı':'Fasilə vaxtı';
  document.title=running?fmt(left)+' · Fokus Səs Mikseri':'Fokus Səs Mikseri';
  $('m-focus').className=mode==='focus'?'on':'';$('m-focus').setAttribute('aria-pressed',mode==='focus');
  $('m-break').className=mode==='brk'?'on':'';$('m-break').setAttribute('aria-pressed',mode==='brk');
  $('tstart').textContent=running?'Fasilə ver':'Başla';
}
function chime(){
  try{var AC=window.AudioContext||window.webkitAudioContext;chimeCtx=chimeCtx||new AC();chimeCtx.resume();
    [660,880,1320].forEach(function(f,i){var t=chimeCtx.currentTime+i*.28,o=chimeCtx.createOscillator(),g=chimeCtx.createGain();
      o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1);
      o.connect(g);g.connect(chimeCtx.destination);o.start(t);o.stop(t+1.1)})}catch(e){}
}
function setMode(m){mode=m;left=DUR[m];running=false;clearInterval(tick);drawT()}
function loop(){
  left=Math.max(0,Math.round((endAt-Date.now())/1000));
  if(left<=0){chime();var n=mode==='focus'?'brk':'focus';mode=n;left=DUR[n];endAt=Date.now()+left*1000;
    toast(n==='brk'?'Fokus bitdi. 5 dəqiqə fasilə ver.':'Fasilə bitdi. Yenidən fokusa qayıt.')}
  drawT();
}
$('tstart').onclick=function(){
  if(running){running=false;clearInterval(tick)}else{running=true;endAt=Date.now()+left*1000;tick=setInterval(loop,250)}
  drawT();
};
$('treset').onclick=function(){setMode(mode)};
$('m-focus').onclick=function(){setMode('focus')};
$('m-break').onclick=function(){setMode('brk')};
drawT();

/* ---------- Canlı mənzərələr (canvas) ---------- */
var cv=$('stage'),g=cv.getContext('2d'),W=0,H=0,dpr=1,T=0,frame=0;
var drops=[],streaks=[],leaves=[],bokeh=[],i;
var grain=document.createElement('canvas');grain.width=grain.height=140;var gg=grain.getContext('2d'),gd=gg.createImageData(140,140);
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
for(i=0;i<220;i++)drops.push({x:rnd(0,1),y:rnd(0,1),l:rnd(.02,.05),s:rnd(.9,1.6)});
for(i=0;i<50;i++)streaks.push({x:rnd(0,1),y:rnd(0,1),l:rnd(.05,.16),s:rnd(.2,.6),p:rnd(0,6)});
for(i=0;i<16;i++)leaves.push({x:rnd(0,1),y:rnd(0,1),s:rnd(.08,.2),r:rnd(0,6),p:rnd(0,6),k:Math.random()<.5});
for(i=0;i<30;i++)bokeh.push({x:rnd(0,1),y:rnd(0,1),r:rnd(.03,.09),p:rnd(0,6),s:rnd(.01,.03)});
var stars=[],sparks=[],birds=[],flies=[];
for(i=0;i<110;i++)stars.push({x:rnd(0,1),y:rnd(0,1),r:rnd(.8,2),t:rnd(.5,2),p:rnd(0,6)});
for(i=0;i<60;i++)sparks.push({x:rnd(.3,.7),y:rnd(0,1),s:rnd(.1,.3),p:rnd(0,6)});
for(i=0;i<9;i++)birds.push({x:rnd(-.3,1),y:rnd(.1,.45),s:rnd(.05,.12),p:rnd(0,6),z:rnd(.6,1.2)});
for(i=0;i<34;i++)flies.push({x:rnd(0,1),y:rnd(.4,.95),p:rnd(0,6),s:rnd(.2,.6)});
function alphaOf(id){return Math.min(1,Math.pow(vis[id],.7))}
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function tint(x,y,r,hex,a){var d=g.createRadialGradient(x,y,0,x,y,r);d.addColorStop(0,rgba(hex,a));d.addColorStop(1,rgba(hex,0));g.fillStyle=d;g.fillRect(0,0,W,H)}
function draw(){
  frame++;T+=.016;
  CH.forEach(function(c){vis[c.id]+=(state[c.id]/100-vis[c.id])*.035});
  var dk=isDark(),bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,dk?'#0b161b':'#e4eeee');bg.addColorStop(1,dk?'#16282f':'#b9d0d2');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  var ar=alphaOf('rain'),aw=alphaOf('wind'),av=alphaOf('wave'),ac=alphaOf('cafe'),an=alphaOf('white'),k=dk?1:.7;
  var af=alphaOf('fire'),ab=alphaOf('bird'),ak=alphaOf('cricket'),at=alphaOf('thunder');
  /* ulduzlar və ay */
  if(dk){var sa=Math.max(0,1-ar*.9-at*.5);
    stars.forEach(function(s){var a=sa*(.25+.55*Math.abs(Math.sin(T*s.t+s.p)));g.fillStyle='rgba(255,255,255,'+a+')';g.fillRect(s.x*W,s.y*H*.65,s.r,s.r)});
    var mg=g.createRadialGradient(W*.82,H*.14,0,W*.82,H*.14,H*.22);mg.addColorStop(0,'rgba(235,242,255,'+.28*sa+')');mg.addColorStop(1,'rgba(235,242,255,0)');g.fillStyle=mg;g.fillRect(0,0,W,H)}
  /* rəng atmosferi */
  if(ar>.01)tint(W*.5,0,H*.9,'#5C8DBF',ar*.55*k);
  if(aw>.01)tint(W*.15,H*.4,H*.8,'#8FBF8A',aw*.4*k);
  if(av>.01)tint(W*.5,H,H*.9,'#1F9BA8',av*.6*k);
  if(ac>.01)tint(W*.3,H*.55,H*.9,'#E8913D',ac*.5*k);
  if(an>.01)tint(W*.5,H*.5,H,'#9AA3CF',an*.25*k);
  if(af>.01)tint(W*.5,H*1.05,H*.8,'#FF7A2E',af*(.55+.12*Math.sin(T*7)+.08*Math.sin(T*13.3))*k);
  if(ab>.01)tint(W*.8,H*.2,H*.8,'#FFE6A0',ab*.35*k);
  if(ak>.01)tint(W*.5,H*.7,H,'#1B3D2B',ak*.5*k);
  if(at>.01)tint(W*.5,0,H,'#4B3F7A',at*.5*k);
  /* kafe bokeh */
  if(ac>.01)bokeh.forEach(function(b){
    var x=(b.x*W+Math.sin(T*b.s*8+b.p)*40)%W,y=(b.y*H-T*b.s*H*.5+H*2)%H,r=b.r*Math.min(W,H)*(1+.1*Math.sin(T+b.p));
    var d=g.createRadialGradient(x,y,0,x,y,r);d.addColorStop(0,'rgba(255,200,120,'+.35*ac+')');d.addColorStop(.7,'rgba(255,170,80,'+.12*ac+')');d.addColorStop(1,'rgba(255,170,80,0)');
    g.fillStyle=d;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  });
  /* dalğalar */
  if(av>.01)for(i=0;i<4;i++){
    var base=H*(1-.1-.18*av*(1-i*.22)),amp=10+34*av*(1-i*.15);
    g.beginPath();g.moveTo(0,H);
    for(var x=0;x<=W;x+=16)g.lineTo(x,base+Math.sin(x*.006+T*(.7+i*.25)+i)*amp+Math.sin(x*.015-T*.9)*amp*.3);
    g.lineTo(W,H);g.closePath();
    g.fillStyle='rgba('+(30+i*18)+','+(140+i*22)+','+(165+i*14)+','+(.3*av)+')';g.fill();
    if(i===0){g.strokeStyle='rgba(255,255,255,'+.35*av+')';g.lineWidth=2;g.stroke()}
  }
  /* külək */
  if(aw>.01){
    g.lineCap='round';
    streaks.forEach(function(s){
      s.x+=s.s*.004*(.5+aw*3);if(s.x>1.2){s.x=-.2;s.y=rnd(0,1)}
      var x=s.x*W,y=s.y*H+Math.sin(T+s.p)*20,l=s.l*W;
      g.strokeStyle='rgba(220,245,225,'+.3*aw+')';g.lineWidth=1.4;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-l*.5,y-12*Math.sin(T*2+s.p),x-l,y);g.stroke();
    });
    leaves.forEach(function(l){
      l.x+=l.s*.004*(.5+aw*3);if(l.x>1.1){l.x=-.1;l.y=rnd(.1,.9)}
      var x=l.x*W,y=l.y*H+Math.sin(T*1.3+l.p)*50;
      g.save();g.translate(x,y);g.rotate(T*(1+l.s*4)+l.r);g.fillStyle=l.k?'rgba(150,200,120,'+.7*aw+')':'rgba(230,170,90,'+.7*aw+')';
      g.beginPath();g.ellipse(0,0,10,4,0,0,7);g.fill();g.restore();
    });
  }
  /* yağış */
  if(ar>.01){
    var n=Math.floor(drops.length*ar),sl=.15+aw*.4;
    g.lineWidth=1.3;g.lineCap='round';g.strokeStyle='rgba(205,228,255,'+(.25+.35*ar)+')';g.beginPath();
    for(i=0;i<n;i++){var d=drops[i];
      d.y+=d.s*.018*(.6+ar);d.x+=d.s*.018*sl*.3*(.6+ar);if(d.y>1.05){d.y=-.05;d.x=Math.random()*1.2-.1}
      if(d.x>1.1)d.x=-.1;
      var x=d.x*W,y=d.y*H;g.moveTo(x,y);g.lineTo(x-d.l*H*sl*.3,y-d.l*H);
    }
    g.stroke();
  }
  /* tonqal qığılcımları */
  if(af>.01){var ns=Math.floor(sparks.length*af);g.fillStyle='rgba(255,170,70,'+(.4+.5*af)+')';
    for(i=0;i<ns;i++){var sp=sparks[i];sp.y-=sp.s*.012*(.6+af);if(sp.y<-.05){sp.y=1.05;sp.x=rnd(.3,.7)}
      g.beginPath();g.arc((sp.x+Math.sin(T*1.5+sp.p)*.03)*W,sp.y*H,1+af*1.6,0,7);g.fill()}}
  /* quşlar */
  if(ab>.01){var nbd=Math.ceil(birds.length*ab);g.lineCap='round';g.lineWidth=2;g.strokeStyle=dk?'rgba(255,240,200,'+(.5*ab+.2)+')':'rgba(40,50,40,'+(.5*ab+.2)+')';
    for(i=0;i<nbd;i++){var bd=birds[i];bd.x+=bd.s*.016*.1*10;if(bd.x>1.15){bd.x=-.15;bd.y=rnd(.1,.45)}
      var bx=bd.x*W,by=bd.y*H+Math.sin(T*.8+bd.p)*18,bw=16*bd.z,bf=Math.sin(T*9+bd.p)*9*bd.z;
      g.beginPath();g.moveTo(bx-bw,by-bf);g.quadraticCurveTo(bx-bw*.4,by-bf*.2-4,bx,by);g.quadraticCurveTo(bx+bw*.4,by-bf*.2-4,bx+bw,by-bf);g.stroke()}}
  /* işıldaquşlar */
  if(ak>.01){var nf=Math.ceil(flies.length*ak);
    for(i=0;i<nf;i++){var fl=flies[i],fx=(fl.x+Math.sin(T*fl.s+fl.p)*.06)*W,fy=(fl.y+Math.cos(T*fl.s*.8+fl.p)*.04)*H,bl=Math.pow(Math.max(0,Math.sin(T*fl.s*2.2+fl.p*3)),3)*ak;
      if(bl>.02){var fg=g.createRadialGradient(fx,fy,0,fx,fy,16);fg.addColorStop(0,'rgba(220,255,140,'+bl+')');fg.addColorStop(1,'rgba(220,255,140,0)');g.fillStyle=fg;g.beginPath();g.arc(fx,fy,16,0,7);g.fill()}}}
  /* ildırım */
  if(flash>.02){g.fillStyle='rgba(215,222,255,'+flash*.5+')';g.fillRect(0,0,W,H);
    if(bolt.length){g.strokeStyle='rgba(255,255,255,'+Math.min(1,flash*1.4)+')';g.lineWidth=2.5;g.shadowColor='#B79CFF';g.shadowBlur=18;g.beginPath();
      bolt.forEach(function(p,j){j?g.lineTo(p[0]*W,p[1]*H):g.moveTo(p[0]*W,p[1]*H)});g.stroke();g.shadowBlur=0}
    flash*=.92}
  /* ağ küy dənəsi */
  if(an>.01&&frame%3===0){
    for(i=0;i<gd.data.length;i+=4){var v=Math.random()*255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255}
    gg.putImageData(gd,0,0);
  }
  if(an>.01){g.save();g.globalAlpha=an*(dk?.16:.1);g.imageSmoothingEnabled=false;g.drawImage(grain,0,0,W,H);g.restore()}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
